<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#142848"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="funnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#5a90ff"/>
      <stop offset="100%" stop-color="#1a2639"/>
    </linearGradient>
    <linearGradient id="car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#991100"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Tornado 3D rings -->
  <ellipse cx="266" cy="120" rx="165" ry="44" fill="none" stroke="url(#funnel)" stroke-width="22" opacity="0.9"/>
  <ellipse cx="250" cy="185" rx="130" ry="35" fill="none" stroke="url(#funnel)" stroke-width="20" opacity="0.85"/>
  <ellipse cx="238" cy="245" rx="95" ry="26" fill="none" stroke="url(#funnel)" stroke-width="18" opacity="0.8"/>
  <ellipse cx="250" cy="300" rx="68" ry="20" fill="none" stroke="url(#funnel)" stroke-width="16" opacity="0.75"/>
  <ellipse cx="256" cy="350" rx="42" ry="13" fill="none" stroke="#00f0ff" stroke-width="14"/>
  <!-- Lightning bolt -->
  <polygon points="285,85 225,215 275,215 215,365 320,190 265,190" fill="#ffdd00"/>
  <!-- Armored Dominator silhouette -->
  <rect x="156" y="370" width="200" height="76" rx="22" fill="url(#car)" stroke="#ffffff" stroke-width="6"/>
  <rect x="190" y="384" width="132" height="32" rx="8" fill="#00f0ff" opacity="0.85"/>
</svg>
